# Render Blueprint — deploy from this repo (https://dashboard.render.com → New → Blueprint)
# Docs: https://render.com/docs/blueprint-spec
#
# After first deploy:
# 1. Set App_Url to https://<this-service>.onrender.com
# 2. Set App_FrontendUrl to your Vercel storefront URL
# 3. Set Cors_AllowedOrigins to storefront + admin Vercel URLs (comma-separated)
# 4. On Vercel (frontend + admin): set BACKEND_URL to this Render URL (same-origin /api proxy)
# 5. Add FIREBASE_PROJECT_ID (and optional Stripe / Cloudinary / Resend)

databases:
  - name: homemart-db
    plan: free
    databaseName: homemart
    user: homemart

services:
  - type: web
    name: homemart-api
    runtime: docker
    # Free spins down after ~15m idle (~1m cold start). Starter stays warm.
    # Plan ID `starter` == `0.5c-512mb` (~$7/mo). See https://render.com/docs/free
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homemart-db
          property: connectionString
      - key: JWT_KEY
        generateValue: true
      - key: Jwt_Issuer
        value: homemart
      - key: Jwt_Audience
        value: homemart
      - key: Seed_OnStartup
        value: "false"
      - key: App_Name
        value: Home Mart
      - key: Shop_DefaultRegion
        value: MM
      - key: Shop_DefaultRegionPrivate
        value: US
      - key: Shop_GpsRegionEnabled
        value: "true"
      - key: Mail_FromAddress
        value: no-reply@homemart.app
      - key: Mail_FromName
        value: Home Mart
      # Set these in the Dashboard on first Blueprint apply (and after you know the public URLs).
      - key: App_Url
        sync: false
      - key: App_FrontendUrl
        sync: false
      - key: Cors_AllowedOrigins
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      # Optional integrations — leave blank in Dashboard if unused.
      - key: STRIPE_KEY
        sync: false
      - key: STRIPE_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
