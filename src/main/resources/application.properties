server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.application.name=home_mart_backend
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/homemart}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:homemart}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.sql.init.mode=never

spring.mail.host=${Mail_Smtp_Host:}
spring.mail.port=${Mail_Smtp_Port:587}
spring.mail.username=${Mail_Smtp_Username:}
spring.mail.password=${Mail_Smtp_Password:}

app.name=${App_Name:Home Mart}
app.url=${App_Url:http://localhost:8080}
app.frontend-url=${App_FrontendUrl:${FRONTEND_URL:http://localhost:3000}}
app.seed.on-startup=${Seed_OnStartup:false}

jwt.issuer=${Jwt_Issuer:homemart}
jwt.audience=${Jwt_Audience:homemart}
jwt.key=${JWT_KEY:${Jwt_Key:change-me-to-a-long-random-secret-string-32chars}}

cors.allowed-origins=${Cors_AllowedOrigins:*}

shop.default-region=${Shop_DefaultRegion:MM}
shop.default-region-private=${Shop_DefaultRegionPrivate:US}
shop.gps-region-enabled=${Shop_GpsRegionEnabled:true}

# MMQR (MyanmarPay) merchant-presented QR — set real merchant id from your bank/MPU
shop.mmqr.guid=${Shop_Mmqr_Guid:A0000006150001}
shop.mmqr.merchant-id=${Shop_Mmqr_MerchantId:HOMEMART001}
shop.mmqr.merchant-name=${Shop_Mmqr_MerchantName:Home Mart}
shop.mmqr.merchant-city=${Shop_Mmqr_MerchantCity:Yangon}
shop.mmqr.mcc=${Shop_Mmqr_Mcc:5411}

# VNQR / VietQR (NAPAS) — set real bank BIN + account
shop.vnqr.bank-bin=${Shop_Vnqr_BankBin:970422}
shop.vnqr.account-number=${Shop_Vnqr_AccountNumber:0123456789}
shop.vnqr.account-name=${Shop_Vnqr_AccountName:HOME MART}
shop.vnqr.merchant-city=${Shop_Vnqr_MerchantCity:Hanoi}
shop.vnqr.mcc=${Shop_Vnqr_Mcc:5411}

stripe.key=${STRIPE_KEY:${Stripe_Key:}}
stripe.secret=${STRIPE_SECRET:${Stripe_Secret:}}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:${Stripe_WebhookSecret:}}
stripe.test-mode-only=${STRIPE_TEST_MODE_ONLY:true}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:${Cloudinary_CloudName:}}
cloudinary.api-key=${CLOUDINARY_API_KEY:${Cloudinary_ApiKey:}}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:${Cloudinary_ApiSecret:}}

mail.from-address=${Mail_FromAddress:no-reply@homemart.app}
mail.from-name=${Mail_FromName:Home Mart}
mail.resend-api-key=${RESEND_API_KEY:${Mail_Resend_ApiKey:}}

firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}

logging.level.root=INFO
logging.level.dev.tintwym.home_mart_backend=INFO
