# Activate with: --spring.profiles.active=local
# Local defaults for Vite SPA on :3000 / API on :5199.
# Datasource still comes from env (DATABASE_URL / SPRING_DATASOURCE_*) when set.

server.port=${PORT:5199}

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

app.url=http://localhost:5199
app.frontend-url=http://localhost:3000
app.seed.on-startup=true

cors.allowed-origins=http://localhost:3000,http://localhost:3001

logging.level.dev.tintwym.home_mart_backend=DEBUG

app.admin.email=admin@homemart.com
app.admin.password=admin12345
app.admin.name=HomeMart Admin
